name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # npm test runs the suites in every engine listed here
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # npm run verify compiles dist/postscribe.js with Closure Compiler as the Epom ad server does, on its JDK
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # lint and typings, build, fail if the committed dist/ is not the build of src/, the suites, the end-to-end check,
      # no Closure Compiler warnings
      - run: npm run verify
