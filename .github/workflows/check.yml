name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # npm test runs the suites in every engine listed here
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # lint and typings, build, fail if the committed dist/ is not the build of src/, the suites, the end-to-end check
      - run: npm run verify
