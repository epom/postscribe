name: publish

# Publishes to npm as @epom-rnd/postscribe when a v* tag is pushed. No npm token: npm trusts this workflow
# (trusted publishing, set up in the package's settings on npmjs.com) and attaches provenance on its own.
# Run by hand, it publishes nothing and only checks that npm still trusts it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later; node 22 ships with 10
      - run: npm install -g npm@11
      # npm run verify compiles dist/postscribe.js with Closure Compiler as the Epom ad server does, on its JDK
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
      - name: Tag matches package.json
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm publish
        if: github.ref_type == 'tag'
      - name: npm trusts this workflow
        if: github.ref_type != 'tag'
        run: |
          oidc=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          name=$(node -p 'encodeURIComponent(require("./package.json").name)')
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$name")
          echo "token exchange: HTTP $status"
          test "$status" = 201
